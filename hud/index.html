<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Driving HUD</title>
<style>
  :root { --fg:#00ff9c; --dim:rgba(0,255,156,.14); --bad:#ff3b4e; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; background:#000; color:var(--fg);
    font-family: ui-monospace, "JetBrains Mono", "Fira Code", Menlo, Consolas, monospace; }
  body.stale { --fg:var(--bad); --dim:rgba(255,59,78,.16); }

  main { height:100%; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:1.2vh; }
  #speed { font-size:min(34vh, 24vw); line-height:1; font-weight:600; letter-spacing:-.02em; }
  .unit { font-size:clamp(12px,2.2vh,20px); letter-spacing:.4em; opacity:.7; }

  .rpmrow { width:min(520px,80vw); margin-top:3vh; }
  .rpmtop { display:flex; justify-content:space-between; font-size:clamp(12px,2.4vh,20px); margin-bottom:.8vh; }
  .track { height:.9vh; min-height:6px; background:var(--dim); border-radius:3px; overflow:hidden; }
  #rpmfill { height:100%; width:0; background:var(--fg); transition:width .12s linear; }

  footer { position:fixed; bottom:0; left:0; right:0; display:flex; justify-content:space-between;
    padding:2vh 3vw; font-size:clamp(11px,1.8vh,15px); opacity:.75; }
  .dot { display:inline-block; width:.7em; height:.7em; border-radius:50%; background:var(--fg); margin-right:.6em; }
  body:not(.stale) .dot.on { animation:blink 1.6s infinite; }
  @keyframes blink { 50% { opacity:.3 } }
</style>
</head>
<body>
  <main>
    <div id="speed">--</div>
    <div class="unit">MPH</div>
    <div class="rpmrow">
      <div class="rpmtop"><span>RPM</span><span id="rpm">--</span></div>
      <div class="track"><div id="rpmfill"></div></div>
    </div>
  </main>
  <footer>
    <span><span class="dot" id="dot"></span><span id="status">connecting</span></span>
    <span id="age"></span>
  </footer>

  <script src="https://unpkg.com/mqtt@5/dist/mqtt.min.js"></script>
  <script>
    const q = new URLSearchParams(location.search);
    const VEHICLE = q.get("vehicle") || "demo";
    const WS_PORT = q.get("port") || "9001";
    const DEMO = q.has("demo");        // ?demo = in-browser simulation, no broker needed
    const MAX_RPM = 6000;
    const $ = id => document.getElementById(id);

    let lastMsg = 0, connected = false;

    function render(d) {
      $("speed").textContent = Math.round(d.speed);
      $("rpm").textContent = d.rpm.toLocaleString();
      $("rpmfill").style.width = Math.min(100, d.rpm / MAX_RPM * 100) + "%";
      $("age").textContent = `${Math.max(0, Date.now() - d.ts)} ms`;
      lastMsg = Date.now();
    }

    if (DEMO) {
      const t0 = Date.now();
      setInterval(() => {
        const t = (Date.now() - t0) / 1000;
        const speed = 55 + 40 * Math.sin(t / 3);
        render({ speed, rpm: Math.round(1000 + speed * 35 + 150 * Math.sin(t * 2)), ts: Date.now() });
      }, 100);
    } else {
      const client = mqtt.connect(`ws://${location.hostname}:${WS_PORT}`, { reconnectPeriod: 1000 });
      client.on("connect", () => { connected = true; client.subscribe(`vehicle/${VEHICLE}/telemetry`); });
      client.on("close",   () => { connected = false; });
      client.on("message", (topic, msg) => render(JSON.parse(msg.toString())));
    }

    // Never show old numbers as if they were live.
    setInterval(() => {
      const fresh = lastMsg && Date.now() - lastMsg < 2000;
      const stale = lastMsg > 0 && !fresh;
      document.body.classList.toggle("stale", stale);
      $("dot").classList.toggle("on", !!fresh);
      $("status").textContent = stale ? "NO DATA" : fresh ? (DEMO ? "simulated" : "live")
                              : connected ? "waiting for data" : "connecting";
      if (stale) $("age").textContent = "";
    }, 250);
  </script>
</body>
</html>
