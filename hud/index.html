<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Driving HUD</title>
  <style>
    body { background:#000; color:#00ff9c; font-family:monospace; text-align:center; margin-top:8vh; }
    #speed { font-size:12rem; line-height:1; }
    #rpm { font-size:3rem; }
    #status { margin-top:2rem; opacity:.7; }
    .stale { color:#f33; }
  </style>
</head>
<body>
  <div id="hud">
    <div id="speed">--</div>
    <div>MPH</div>
    <div id="rpm">-- RPM</div>
  </div>
  <div id="status">connecting...</div>

  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <script>
    const VEHICLE = "demo";
    const client = mqtt.connect(`ws://${location.hostname}:9001`);
    let lastMsg = 0;

    client.on("connect", () => {
      document.getElementById("status").textContent = "connected";
      client.subscribe(`vehicle/${VEHICLE}/telemetry`);
    });

    client.on("message", (topic, message) => {
      const d = JSON.parse(message.toString());
      document.getElementById("speed").textContent = Math.round(d.speed);
      document.getElementById("rpm").textContent = d.rpm + " RPM";
      lastMsg = Date.now();
    });

    // Stale-data detection: never show old numbers as if they were live.
    setInterval(() => {
      const stale = lastMsg && Date.now() - lastMsg > 2000;
      document.getElementById("hud").classList.toggle("stale", !!stale);
      if (stale) document.getElementById("status").textContent = "NO DATA";
      else if (lastMsg) document.getElementById("status").textContent = "live";
    }, 500);
  </script>
</body>
</html>
