services:
  broker:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./broker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  simulator:
    build: ./simulator
    depends_on: [broker]
    environment:
      MQTT_HOST: broker

  hud:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./hud:/usr/share/nginx/html:ro
